<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="description" content="Neon Strike 3D - A browser-based 3D mobile shooter">
    <title>Neon Strike 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
        #gameCanvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: 1; }

        #loadingScreen { position: fixed; inset: 0; z-index: 100; background: radial-gradient(ellipse at center, #1a1a3a 0%, #050510 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #00f0ff; }
        #loadingScreen h1 { font-size: 2.5em; letter-spacing: 4px; text-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff; margin-bottom: 30px; }
        .loadingBar { width: 250px; height: 6px; background: #1a1a3a; border-radius: 3px; overflow: hidden; border: 1px solid #00f0ff44; }
        #loadingFill { width: 0%; height: 100%; background: linear-gradient(90deg, #00f0ff, #ff00aa); transition: width 0.3s; }
        #loadingText { margin-top: 12px; font-size: 0.8em; color: #00f0ff99; }

        #charSelect { position: fixed; inset: 0; z-index: 90; background: radial-gradient(ellipse at center, #1a1a3a 0%, #050510 100%); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; padding: 20px; overflow-y: auto; }
        #charSelect h2 { font-size: 1.6em; color: #00f0ff; text-shadow: 0 0 15px #00f0ff; margin-bottom: 5px; text-align: center; }
        #charSelect .subtitle { font-size: 0.75em; color: #aaa; margin-bottom: 20px; text-align: center; }
        .charGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 500px; width: 100%; }
        @media (min-width: 600px) { .charGrid { grid-template-columns: repeat(4, 1fr); } }
        .charCard { background: linear-gradient(135deg, rgba(20,20,50,0.9), rgba(10,10,30,0.9)); border: 2px solid #333366; border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
        .charCard:active { transform: scale(0.95); }
        .charCard.selected { border-color: #00f0ff; box-shadow: 0 0 20px #00f0ff66; }
        .charAvatar { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 1.8em; }
        .charName { font-size: 0.95em; font-weight: bold; margin-bottom: 2px; }
        .charSkill { font-size: 0.65em; color: #00f0ff; margin-bottom: 4px; }
        .charDesc { font-size: 0.6em; color: #999; line-height: 1.3; }
        #startGameBtn { margin-top: 25px; padding: 14px 50px; font-size: 1.1em; font-weight: bold; color: #050510; background: linear-gradient(135deg, #00f0ff, #00a0ff); border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 0 25px #00f0ff66; transition: all 0.2s; }
        #startGameBtn:active { transform: scale(0.95); }
        #startGameBtn:disabled { opacity: 0.4; box-shadow: none; cursor: default; }

        #hud { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: none; }
        #topBar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 15px; }
        .hud-panel { background: rgba(5,5,20,0.65); border: 1px solid #00f0ff33; border-radius: 8px; padding: 6px 12px; backdrop-filter: blur(4px); }
        #scorePanel { color: #00f0ff; font-size: 0.9em; font-weight: bold; }
        #scorePanel .label { font-size: 0.6em; color: #aaa; font-weight: normal; }
        #wavePanel { color: #ff6600; font-size: 0.9em; font-weight: bold; text-align: center; }
        #fpsPanel { color: #0f0; font-size: 0.7em; }
        #healthContainer { position: absolute; bottom: 100px; left: 15px; width: 200px; }
        #healthLabel { font-size: 0.65em; color: #aaa; margin-bottom: 2px; }
        #healthBarBg { width: 100%; height: 14px; background: rgba(5,5,20,0.7); border: 1px solid #ff004466; border-radius: 7px; overflow: hidden; }
        #healthBar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0044, #ff6600); transition: width 0.3s; }
        #skillContainer { position: absolute; bottom: 100px; right: 15px; width: 130px; }
        #skillLabel { font-size: 0.65em; color: #00f0ff; margin-bottom: 2px; text-align: right; }
        #skillBarBg { width: 100%; height: 10px; background: rgba(5,5,20,0.7); border: 1px solid #00f0ff44; border-radius: 5px; overflow: hidden; }
        #skillBar { width: 100%; height: 100%; background: linear-gradient(90deg, #00f0ff, #aa00ff); transition: width 0.1s; }
        #ammoDisplay { position: absolute; bottom: 130px; right: 90px; text-align: right; }
        #ammoText { font-size: 1.4em; font-weight: bold; color: #fff; text-shadow: 0 0 8px #000; }
        #ammoMax { font-size: 0.7em; color: #aaa; }
        #weaponName { font-size: 0.6em; color: #00f0ff; margin-top: 2px; }
        #crosshair { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; pointer-events: none; opacity: 0.7; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00f0ff; box-shadow: 0 0 4px #00f0ff; }
        #crosshair::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
        #crosshair::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
        #hitMarker { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
        #hitMarker.show { opacity: 1; }
        #hitMarker::before, #hitMarker::after { content: ''; position: absolute; background: #ff4444; }
        #hitMarker::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%) rotate(45deg); }
        #hitMarker::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%) rotate(45deg); }
        #damageVignette { position: fixed; inset: 0; z-index: 60; pointer-events: none; box-shadow: inset 0 0 100px rgba(255,0,0,0.6); opacity: 0; transition: opacity 0.15s; }
        #killFeed { position: absolute; top: 60px; right: 15px; display: flex; flex-direction: column; gap: 4px; }
        .killMsg { background: rgba(5,5,20,0.7); border-left: 3px solid #ff4444; padding: 4px 10px; font-size: 0.7em; color: #ddd; border-radius: 0 4px 4px 0; animation: slideIn 0.2s; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        #mobileControls { position: fixed; inset: 0; z-index: 55; pointer-events: none; display: none; }
        #joystickZone { position: absolute; bottom: 0; left: 0; width: 45%; height: 45%; pointer-events: auto; }
        #joystickBase { position: absolute; width: 110px; height: 110px; border-radius: 50%; background: rgba(0,240,255,0.08); border: 2px solid rgba(0,240,255,0.3); display: none; pointer-events: none; }
        #joystickKnob { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(0,240,255,0.3); border: 2px solid rgba(0,240,255,0.6); display: none; pointer-events: none; }
        .actionBtn { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; pointer-events: auto; border: 2px solid; backdrop-filter: blur(4px); transition: transform 0.05s, background 0.05s; }
        .actionBtn:active { transform: scale(0.88); }
        #fireBtn { bottom: 60px; right: 20px; width: 80px; height: 80px; background: rgba(255,0,80,0.2); border-color: rgba(255,0,80,0.6); color: #ff5577; font-size: 1.2em; }
        #fireBtn.firing { background: rgba(255,0,80,0.5); transform: scale(0.88); }
        #reloadBtn { bottom: 150px; right: 30px; width: 56px; height: 56px; background: rgba(255,170,0,0.15); border-color: rgba(255,170,0,0.5); color: #ffaa00; font-size: 0.7em; }
        #jumpBtn { bottom: 70px; right: 110px; width: 60px; height: 60px; background: rgba(0,255,100,0.15); border-color: rgba(0,255,100,0.5); color: #00ff66; font-size: 0.7em; }
        #skillBtn { bottom: 130px; right: 100px; width: 64px; height: 64px; background: rgba(170,0,255,0.15); border-color: rgba(170,0,255,0.6); color: #aa00ff; font-size: 0.65em; }
        #skillBtn.ready { animation: skillPulse 1s infinite; }
        @keyframes skillPulse { 0%,100% { box-shadow: 0 0 8px rgba(170,0,255,0.4); } 50% { box-shadow: 0 0 25px rgba(170,0,255,0.8); } }
        #aimBtn { bottom: 160px; right: 200px; width: 50px; height: 50px; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); color: #aaa; font-size: 0.6em; }
        #lookZone { position: absolute; bottom: 0; right: 0; width: 55%; height: 55%; pointer-events: auto; }

        #gameOverScreen { position: fixed; inset: 0; z-index: 80; background: rgba(5,5,10,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        #gameOverScreen h2 { font-size: 2.5em; color: #ff0044; text-shadow: 0 0 20px #ff0044; margin-bottom: 20px; }
        .gameOverStat { font-size: 1em; color: #ddd; margin: 5px 0; }
        .gameOverStat .val { color: #00f0ff; font-weight: bold; }
        #restartBtn { margin-top: 30px; padding: 14px 40px; font-size: 1.1em; font-weight: bold; color: #050510; background: linear-gradient(135deg, #00f0ff, #00a0ff); border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 0 25px #00f0ff66; }
        #restartBtn:active { transform: scale(0.95); }
        #pauseBtn { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; border-radius: 50%; background: rgba(5,5,20,0.7); border: 1px solid #00f0ff44; display: flex; align-items: center; justify-content: center; color: #00f0ff; pointer-events: auto; cursor: pointer; z-index: 70; display: none; }
        #pauseScreen { position: fixed; inset: 0; z-index: 85; background: rgba(5,5,10,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        #pauseScreen h2 { color: #00f0ff; margin-bottom: 30px; font-size: 2em; }
        .pauseBtn { padding: 12px 40px; margin: 8px; font-size: 1em; border-radius: 25px; border: 1px solid #00f0ff44; background: rgba(20,20,50,0.8); color: #fff; cursor: pointer; }
        .pauseBtn:active { background: rgba(0,240,255,0.2); }
        #notify { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); background: rgba(5,5,20,0.85); border: 1px solid #00f0ff44; border-radius: 8px; padding: 10px 20px; color: #00f0ff; font-size: 0.9em; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 65; text-align: center; }
        #notify.show { opacity: 1; }
        #waveAnnounce { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5em; font-weight: bold; color: #ff6600; text-shadow: 0 0 30px #ff6600; pointer-events: none; opacity: 0; z-index: 65; text-align: center; }
        #waveAnnounce.show { animation: waveAnim 2s; }
        @keyframes waveAnim { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="loadingScreen">
        <h1>NEON STRIKE 3D</h1>
        <div class="loadingBar"><div id="loadingFill"></div></div>
        <div id="loadingText">Loading game engine...</div>
    </div>
    <div id="charSelect">
        <h2>SELECT YOUR OPERATIVE</h2>
        <div class="subtitle">Each character has a unique active skill</div>
        <div class="charGrid" id="charGrid"></div>
        <button id="startGameBtn" disabled>DEPLOY</button>
    </div>
    <div id="hud">
        <div id="topBar">
            <div class="hud-panel" id="scorePanel"><span class="label">SCORE</span><br>0</div>
            <div class="hud-panel" id="wavePanel"><span style="font-size:0.6em;color:#aaa;">WAVE</span><br>1</div>
            <div class="hud-panel" id="fpsPanel">60 FPS</div>
        </div>
        <div id="crosshair"></div>
        <div id="hitMarker"></div>
        <div id="killFeed"></div>
        <div id="healthContainer">
            <div id="healthLabel">HEALTH</div>
            <div id="healthBarBg"><div id="healthBar"></div></div>
        </div>
        <div id="ammoDisplay">
            <span id="ammoText">30</span><span id="ammoMax">/30</span>
            <div id="weaponName">RIFLE</div>
        </div>
        <div id="skillContainer">
            <div id="skillLabel">SKILL READY</div>
            <div id="skillBarBg"><div id="skillBar"></div></div>
        </div>
        <div id="notify"></div>
        <div id="waveAnnounce"></div>
    </div>
    <div id="damageVignette"></div>
    <div id="mobileControls">
        <div id="lookZone"></div>
        <div id="joystickZone">
            <div id="joystickBase"></div>
            <div id="joystickKnob"></div>
        </div>
        <div id="fireBtn" class="actionBtn">FIRE</div>
        <div id="reloadBtn" class="actionBtn">RELOAD</div>
        <div id="jumpBtn" class="actionBtn">JUMP</div>
        <div id="skillBtn" class="actionBtn">SKILL</div>
        <div id="aimBtn" class="actionBtn">AIM</div>
    </div>
    <div id="pauseBtn">⏸</div>
    <div id="pauseScreen">
        <h2>PAUSED</h2>
        <button class="pauseBtn" id="resumeBtn">RESUME</button>
        <button class="pauseBtn" id="quitBtn">QUIT TO MENU</button>
    </div>
    <div id="gameOverScreen">
        <h2>ELIMINATED</h2>
        <div class="gameOverStat">Final Score: <span class="val" id="finalScore">0</span></div>
        <div class="gameOverStat">Waves Survived: <span class="val" id="finalWave">0</span></div>
        <div class="gameOverStat">Kills: <span class="val" id="finalKills">0</span></div>
        <button id="restartBtn">PLAY AGAIN</button>
    </div>
    <!-- Three.js (r128 UMD build from CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Game source -->
    <script src="src/Config.js"></script>
    <script src="src/AssetFactory.js"></script>
    <script src="src/InputManager.js"></script>
    <script src="src/Characters.js"></script>
    <script src="src/EnemyAI.js"></script>
    <script src="src/WeaponSystem.js"></script>
    <script src="src/Arena.js"></script>
    <script src="src/Effects.js"></script>
    <script src="src/Game.js"></script>
    <script src="src/Main.js"></script>
</body>
</html>
